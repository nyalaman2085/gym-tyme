<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GYM TYME</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="GYM TYME home">
        <img src="images/logo.svg" alt="GYM TYME logo" />
      </a>
    </header>

    <main>
      <section id="home" class="hero-panel">
        <div class="hero-visual">
          <img
            src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=80"
            alt="Athlete lifting dumbbells"
          />
        </div>

        <div class="booking-card">
          <form class="booking-form">
            <label class="field">
              <span class="sr-only">Name</span>
              <input type="text" name="username" placeholder="Enter your name" />
            </label>

            <label class="field">
              <span class="sr-only">Email</span>
              <input type="email" name="email" placeholder="Enter your Email" />
            </label>

            <div class="option-row">
              <label><input type="radio" name="gender" checked /> Male</label>
              <label><input type="radio" name="gender" /> Female</label>
            </div>

            <div class="check-grid">
              <label><input type="checkbox" name="equipment" /> Weights</label>
              <label><input type="checkbox" name="equipment" /> Dumbells</label>
              <label><input type="checkbox" name="equipment" /> Ropes</label>
              <label><input type="checkbox" name="equipment" /> Shirts</label>
            </div>

            <button type="submit">Book your equipment</button>
          </form>
        </div>
      </section>

      <section class="equipment-list" id="equipment">
        <h2>Get your latest equipment</h2>

        <div class="cards">
          <article class="card">
            <img
              src="https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=500&q=80"
              alt="Dumbbells"
            />
          </article>
          <article class="card">
            <img
              src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=500&q=80"
              alt="Barbell"
            />
          </article>
          <article class="card">
            <img
              src="https://images.unsplash.com/photo-1599058917765-a780eda07a3e?auto=format&fit=crop&w=500&q=80"
              alt="Kettlebell"
            />
          </article>
          <article class="card">
            <img
              src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=500&q=80"
              alt="Weight plates"
            />
          </article>
        </div>
      </section>

      <section class="segments">
        <article class="segment segment-light">
          <h2>Equipment</h2>
          <img
            src="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?auto=format&fit=crop&w=900&q=80"
            alt="Gym equipment machines"
          />
        </article>

        <article class="segment segment-dark" id="membership">
          <h2>Membership</h2>
          <img
            src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=900&q=80"
            alt="Gym membership training session"
          />
        </article>
      </section>
    </main>
  </body>
</html>
