<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GYM TYME Mobile</title>
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <main class="phone-page">
      <header class="mobile-nav">
        <img src="images/logo-icon.svg" alt="GYM TYME logo icon" />
      </header>

      <section class="mobile-hero">
        <div class="hero-copy">
          <h2>Premium Gym Equipment</h2>
          <p>No Hassle, Free Delivery</p>
        </div>

        <img
          class="hero-image"
          src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=80"
          alt="Athlete lifting dumbbells"
        />
      </section>

      <section class="form-shell">
        <form class="mobile-form" aria-label="Gym equipment booking form">
          <input
            type="text"
            name="username"
            placeholder="Name"
            autocomplete="name"
            aria-label="Name"
          />
          <input
            type="email"
            name="email"
            placeholder="Email"
            autocomplete="email"
            aria-label="Email"
          />

          <div class="gender-row">
            <label><input type="radio" name="gender" checked /> Male</label>
            <label><input type="radio" name="gender" /> Female</label>
          </div>

          <div class="check-grid">
            <label><input type="checkbox" name="equipment" /> Weights</label>
            <label><input type="checkbox" name="equipment" /> Dumbbells</label>
            <label><input type="checkbox" name="equipment" /> Ropes</label>
            <label><input type="checkbox" name="equipment" /> Shirts</label>
          </div>

          <button type="submit">Book Your Equipment</button>
        </form>
      </section>

      <section class="mobile-equipment-list">
        <h2>Get your latest equipment</h2>

        <div class="equipment-cards">
          <article class="equipment-card">
            <img
              src="https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=500&q=80"
              alt="Dumbbells"
            />
          </article>
          <article class="equipment-card">
            <img
              src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=500&q=80"
              alt="Barbell"
            />
          </article>
          <article class="equipment-card">
            <img
              src="https://images.unsplash.com/photo-1599058917765-a780eda07a3e?auto=format&fit=crop&w=500&q=80"
              alt="Kettlebell"
            />
          </article>
          <article class="equipment-card">
            <img
              src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=500&q=80"
              alt="Weight plates"
            />
          </article>
        </div>
      </section>

      <section class="mobile-split">
        <article class="mobile-segment segment-light">
          <h2>Equipment</h2>
          <img
            src="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?auto=format&fit=crop&w=900&q=80"
            alt="Gym equipment machines"
          />
        </article>

        <article class="mobile-segment segment-dark">
          <h2>Membership</h2>
          <img
            src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=900&q=80"
            alt="Membership training"
          />
        </article>
      </section>
    </main>
  </body>
</html>
